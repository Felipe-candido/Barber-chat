paths:
  contacts:
    parameters: [{$ref: '#/components/parameters/Slug'}]
    get:
      summary: Owner or barber lists all contacts of the authorized shop
      description: Includes manual and booking contacts without requiring appointments or subscription. Newest first with UUID tie-breaker. Cursor is bound to shop and normalized filters. No public directory; no-store.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: name, schema: {type: string, maxLength: 201}, description: Literal case-insensitive substring}
        - {in: query, name: phone, schema: {type: string, maxLength: 40}, description: Complete number; exact match after normalization}
        - {in: query, name: phone_country, schema: {type: string, minLength: 2, maxLength: 2}, description: Required for a national number; omit for explicit international number}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {in: query, name: cursor, schema: {type: string, maxLength: 512}}
      responses:
        '200':
          description: Shop-local page; no-store
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Contact'}}
                  next_cursor: {type: [string, 'null'], maxLength: 512}
        default: {$ref: '#/components/responses/Error'}
    post:
      summary: Owner or barber creates a contact without booking or messaging
      description: Tenant comes from authorized slug. Duplicate normalized phone returns 409 without overwriting name. Does not grant consent or call WhatsApp. After a lost response read by phone; never automatically repeat POST.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [first_name, phone]
              properties:
                first_name: {type: string, minLength: 1, maxLength: 100}
                last_name: {type: string, maxLength: 100, default: ''}
                phone: {type: string, minLength: 1, maxLength: 40}
                phone_country: {type: string, minLength: 2, maxLength: 2, description: Required for national numbers; example BR}
      responses:
        '201':
          description: Contact with server UUID and timestamp; no-store
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contact'}
        default: {$ref: '#/components/responses/Error'}
    options:
      responses:
        '204': {description: Allowed-origin GET/POST preflight without authentication}
  contact:
    parameters:
      - {$ref: '#/components/parameters/Slug'}
      - {in: path, name: contactID, required: true, schema: {type: string, format: uuid}}
    get:
      summary: Owner or barber reads a shop contact
      description: UUID alone does not authorize access. Does not return appointment history or expand barber agenda permissions. No-store.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Authorized contact
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Contact'}
        default: {$ref: '#/components/responses/Error'}
    options:
      responses:
        '204': {description: Allowed-origin GET preflight}
components:
  parameters:
    Slug: {in: path, name: slug, required: true, schema: {type: string}}
  schemas:
    Contact:
      type: object
      required: [id, shop_id, first_name, last_name, name, phone, created_at]
      properties:
        id: {type: string, format: uuid}
        shop_id: {type: string, format: uuid}
        first_name: {type: string, minLength: 1, maxLength: 100}
        last_name: {type: string, maxLength: 100}
        name: {type: string, minLength: 1, maxLength: 201}
        phone: {type: string, pattern: '^\+[1-9][0-9]{6,14}$'}
        created_at: {type: string, format: date-time}
  responses:
    Error:
      description: 400 invalid body/search/cursor; 401 missing/invalid session; 403 revoked/inactive membership; 404 contact not found in scope; 409 contact_exists; 413 body over 2 KiB; 415 media type; 422 invalid_contact; 503 contact_unavailable. No raw database errors or PII in errors/logs.
      content:
        application/json:
          schema: {$ref: './openapi.yaml#/components/schemas/Error'}
