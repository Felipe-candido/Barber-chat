# Implemented: recording, reading and cancelling product sales (deliveries C/D).
paths:
  sales:
    parameters:
      - {in: path, name: slug, required: true, schema: {type: string}}
    get:
      operationId: listProductSales
      summary: List sales in a bounded civil-date period, with item snapshots
      description: Dates are inclusive in the shop IANA timezone, with at most one calendar year and years 1900–9998. Ordered by sold_at DESC and id DESC. Owner sees all unit sales or filters a professional; barber is always restricted to its current professional before pagination. Current access is required; subscription coverage and product/professional activity do not gate owner history. Two bulk queries fetch the page and its items. Cursor is a page position bound to actor, shop, effective professional, dates, status and timezone, not an authorization credential. Unknown or repeated query parameters are rejected.
      security: [{bearerAuth: []}]
      parameters:
        - {in: query, name: from, required: true, schema: {type: string, format: date}}
        - {in: query, name: through, required: true, schema: {type: string, format: date}}
        - {in: query, name: professional_id, schema: {type: string, format: uuid}}
        - {in: query, name: status, schema: {type: string, enum: [recorded, cancelled]}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
        - {in: query, name: cursor, schema: {type: string, maxLength: 1024}}
      responses:
        '200':
          description: Authorized page; no-store. Empty next_cursor means no further page. Each item includes cancellation or null.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, timezone]
                properties:
                  items: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Sale'}}
                  next_cursor: {type: string}
                  timezone: {type: string}
        '400': {description: invalid_sales_query; invalid or excessive period, filter, cursor or limit}
        '401': {description: Authentication required}
        '403': {description: Current unit access denied or barber selected a different professional}
        '503': {description: sale_unavailable; retry the read}
    post:
      operationId: registerProductSale
      summary: Authorized staff records a product sale and stock withdrawals atomically
      description: Actor/shop come from authenticated context. Barber is attributed to its current active professional. Owner can select a professional or leave an independent sale unassigned. Appointment linkage requires the same shop/professional and scheduled, confirmed or completed status. Linkage never completes an appointment. New self-service sales require current subscription coverage; publication is not required. Authorized completed replay bypasses current catalog/stock/coverage checks.
      security: [{bearerAuth: []}]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          description: Generate 32 random bytes as lowercase hex; preserve this key and original body after an uncertain response
          schema: {type: string, pattern: '^[a-f0-9]{64}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [items]
              properties:
                professional_id: {type: [string, 'null'], format: uuid, description: Optional; barber cannot select another professional}
                appointment_id: {type: [string, 'null'], format: uuid, description: Optional linkage; its professional is used if professional_id is omitted}
                items:
                  type: array
                  minItems: 1
                  maxItems: 50
                  description: Product IDs must be distinct. Item ordering does not change retry identity. Expected prices/versions are review preconditions; effective snapshots come from the locked catalog.
                  items:
                    type: object
                    additionalProperties: false
                    required: [product_id, quantity, expected_product_version, expected_unit_price_cents]
                    properties:
                      product_id: {type: string, format: uuid}
                      quantity: {type: integer, minimum: 1, maximum: 2147483647}
                      expected_product_version: {type: integer, minimum: 1}
                      expected_unit_price_cents: {type: integer, minimum: 1, maximum: 9007199254740991}
      responses:
        '201':
          description: Sale, immutable item snapshots, source-unique withdrawals and command result committed; no-store
          content: {application/json: {schema: {$ref: '#/components/schemas/Sale'}}}
        '200':
          description: Receipt recovered with replayed=true and current cancellation state, without another withdrawal; access revalidated before disclosure
          content: {application/json: {schema: {$ref: '#/components/schemas/Sale'}}}
        '400': {description: Invalid JSON/UUID, missing reviewed item fields or invalid/missing idempotency key}
        '401': {description: Authentication required}
        '402': {description: shop_subscription_required for owner; regularize coverage without repeating a new sale automatically}
        '403': {description: access_denied or shop_subscription_required for barber; no billing details exposed}
        '409': {description: sale_price_changed, sale_product_unavailable, insufficient_stock, sale_appointment_unavailable, idempotency_conflict or sale_command_pending}
        '413': {description: Body exceeds 16 KiB}
        '415': {description: application/json required}
        '422': {description: invalid_sale; invalid/duplicate items, quantities or unsafe totals}
        '503': {description: sale_unavailable; result may have committed, preserve and explicitly retry original key/body}
  sale:
    parameters:
      - {in: path, name: slug, required: true, schema: {type: string}}
      - {in: path, name: saleID, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getProductSale
      summary: Read a recorded or cancelled sale with original item snapshots and audit
      description: Owner reads any sale in the unit. Barber only reads a sale attributed to its own current active professional; other attribution returns 404. Tenant and professional filters apply in SQL before fetching items. No subscription/publication requirement.
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Sale receipt; no-store; replayed=false
          content: {application/json: {schema: {$ref: '#/components/schemas/Sale'}}}
        '400': {description: Invalid sale UUID}
        '401': {description: Authentication required}
        '403': {description: Current unit access denied}
        '404': {description: sale_not_found in the authorized scope}
        '503': {description: sale_unavailable; retry the read}
  cancel:
    parameters:
      - {in: path, name: slug, required: true, schema: {type: string}}
      - {in: path, name: saleID, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: cancelProductSale
      summary: Owner cancels a sale with explicit full restock decision
      description: JSON up to 16 KiB. Original sale, values and items remain immutable. Restock true appends one full reversal per original withdrawal, including inactive products; false leaves the goods withdrawn. Header audit, optional stock returns and command result commit together. Concurrent requests and matching repeats cannot return stock twice. A matching repeat with another key returns the stored cancellation; original actor/time/version remain unchanged. Different reason/restock conflicts. No partial return, appointment transition, customer payment refund or subscription/publication requirement. Cancel key has a separate namespace from registration. Current owner authority is revalidated even on replay.
      security: [{bearerAuth: []}]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, pattern: '^[a-f0-9]{64}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_version, reason, restock]
              properties:
                expected_version: {type: integer, minimum: 1, description: Must match current recorded version for the first transition; matching repeats return the stored cancellation}
                reason: {type: string, minLength: 1, maxLength: 500, description: Trimmed nonempty text without control characters}
                restock: {type: boolean, description: Required boolean; true only for mistaken withdrawals or goods actually returned}
      responses:
        '200':
          description: Cancellation committed or recovered; replayed indicates no new transition; no-store
          content: {application/json: {schema: {$ref: '#/components/schemas/Sale'}}}
        '400': {description: Invalid JSON/UUID, missing/null required fields or invalid/missing idempotency key}
        '401': {description: Authentication required}
        '403': {description: Owner access required}
        '404': {description: sale_not_found in this unit}
        '409': {description: sale_version_changed, sale_already_cancelled with different instructions, stock_limit_exceeded, idempotency_conflict or sale_command_pending; no partial cancellation}
        '413': {description: Body exceeds 16 KiB}
        '415': {description: application/json required}
        '422': {description: invalid_sale; invalid version or cancellation reason}
        '503': {description: sale_unavailable; preserve original key/body and explicitly retry after checking result}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    Sale:
      type: object
      additionalProperties: false
      required: [id, shop_id, recorded_by_user_id, professional_id, appointment_id, professional_name, items, status, currency, total_cents, version, sold_at, replayed, cancellation]
      properties:
        id: {type: string, format: uuid}
        shop_id: {type: string, format: uuid}
        recorded_by_user_id: {type: string, format: uuid}
        professional_id: {type: [string, 'null'], format: uuid}
        appointment_id: {type: [string, 'null'], format: uuid}
        professional_name: {type: string}
        status: {type: string, enum: [recorded, cancelled]}
        currency: {type: string, const: BRL}
        total_cents: {type: integer, minimum: 1, maximum: 9007199254740991}
        version: {type: integer, enum: [1, 2], description: Recorded is version 1; the sole cancellation is version 2}
        sold_at: {type: string, format: date-time}
        replayed: {type: boolean}
        cancellation:
          type: [object, 'null']
          additionalProperties: false
          required: [actor_id, reason, restock, cancelled_at]
          properties:
            actor_id: {type: string, format: uuid}
            reason: {type: string}
            restock: {type: boolean}
            cancelled_at: {type: string, format: date-time}
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [id, product_id, product_name, quantity, unit_price_cents, line_total_cents, currency]
            properties:
              id: {type: string, format: uuid}
              product_id: {type: string, format: uuid}
              product_name: {type: string}
              quantity: {type: integer, minimum: 1, maximum: 2147483647}
              unit_price_cents: {type: integer, minimum: 1, maximum: 9007199254740991}
              line_total_cents: {type: integer, minimum: 1, maximum: 9007199254740991}
              currency: {type: string, const: BRL}
